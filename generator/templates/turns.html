<script type="application/json" id="game-info">
  { "name": "Treasure Hunt", "description": "Take turns: roll, pick a direction, and be the first to reach the treasure.", "minPlayers": 1, "maxPlayers": 6,
    "tags": ["board"], "minutes": [3, 8] }
</script>
<!--
  STARTER TEMPLATE: TURN-BASED ADVENTURE (plan §13i). One player acts at a time; the big
  screen draws the board with simple shapes on a canvas and keeps a log; the phone whose
  turn it is gets buttons. The example game is "Treasure Hunt": swap in your own
  world and actions where it says TEMPLATE.

  The shape, with party.kit:
    state `g` (everything: saved with party.save after every change, restored in party.ready)
    turns (party.kit.turns): whose turn, skipping players who left
    phases (party.kit.phases): 'turn' with a time limit, then 'won'
    party.on('event') → only the current player's valid choice counts → act() → nextTurn()
  Already handled: a turn timer (a slow or missing player is skipped), players who leave
  (skipped at once), phones that reload, and a big screen that reloads mid-turn.
-->
<style>
  .big-screen { display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; height: 100%; box-sizing: border-box; padding: 1rem; }
  #board { display: block; width: 100%; height: 60vh; min-height: 14rem; background: #1b2030; border-radius: var(--radius); }
  .log { font-family: var(--mono); font-size: 0.9rem; list-style: none; padding: 0; }
  .dirs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
</style>
<div id="app"></div>
<script>
  'use strict';

  // ---- TEMPLATE: the world and its actions ----------------------------------------------------
  // The board as data: '#' a wall, '$' the treasure, ' ' open floor. (Drawn with shapes below.)
  const MAP = [
    '##########################',
    '#        #               #',
    '#  ##    #     ######    #',
    '#   #          #    #    #',
    '#   #####      #  $ #    #',
    '#              #    #    #',
    '#     ###      ##  ##    #',
    '#                        #',
    '##########################',
  ];
  const START = { x: 2, y: 7 };
  const TURN_MS = 20_000;
  const DIRS = { North: [0, -1], South: [0, 1], West: [-1, 0], East: [1, 0] };
  const solid = (x, y) => MAP[y]?.[x] !== ' ' && MAP[y]?.[x] !== '$';

  /** The current player's choices this turn. */
  const choicesFor = () => Object.keys(DIRS);

  /** Do the action; returns a line for the log, and whether that player has won. */
  function act(g, hero, choice) {
    const [dx, dy] = DIRS[choice];
    let steps = 0;
    while (steps < g.roll && !solid(hero.x + dx, hero.y + dy)) {
      hero.x += dx;
      hero.y += dy;
      steps += 1;
      if (MAP[hero.y][hero.x] === '$') return { line: `${hero.name} finds the treasure!`, won: true };
    }
    return { line: `${hero.name} rolled ${g.roll} and went ${choice.toLowerCase()} ${steps} step${steps === 1 ? '' : 's'}.`, won: false };
  }
  // ---- end of the world -------------------------------------------------------------------------

  party.ready(({ role, me, restored }) => (role === 'host' ? referee(restored) : phone(me)));

  function referee(restored) {
    const { el, timer } = party.ui;
    const { turns, phases, roll, colorOf, rank } = party.kit;
    const app = document.getElementById('app');
    const status = el('p', { class: 'big-text', role: 'status' });
    const logList = el('ul', { class: 'log', 'aria-label': 'Log' });
    const timerSlot = el('div');
    app.append(el('div', { class: 'big-screen' }, el('div', { class: 'stack' }, el('h1', {}, 'Treasure Hunt'), el('canvas', { id: 'board', role: 'img', 'aria-label': 'The board' })), el('div', { class: 'stack' }, status, timerSlot, logList)));
    const board = document.getElementById('board');
    let clock = null;

    const g = restored ?? {
      turns: turns.start(), // everyone, in join order
      roll: 1,
      log: ['Find the treasure (the gold star)! Roll, then pick a direction.'],
      winner: null,
      heroes: party.players.map((p, i) => ({ id: p.id, name: p.name, color: colorOf(p.id), x: START.x + (i % 3), y: START.y - Math.floor(i / 3) })),
      flow: {},
    };
    const heroOf = (id) => g.heroes.find((h) => h.id === id);
    const log = (line) => (g.log = [...g.log, line].slice(-8));

    const flow = phases(
      {
        turn: {
          ms: TURN_MS,
          enter() {
            g.roll = roll(3);
            show();
          },
          timeout() {
            log(`${heroOf(turns.current(g.turns)).name} is skipped.`);
            nextTurn();
          },
        },
        won: { ms: 4000, enter: () => show(), timeout: () => party.end(rank({ [g.winner]: 1 })) },
      },
      { state: g.flow, onChange: () => party.save(g) },
    );

    /** The next connected player's turn (turns.next skips anyone who left). */
    function nextTurn() {
      turns.next(g.turns);
      flow.go('turn');
    }

    party.on('event', (from, data) => {
      const hero = heroOf(turns.current(g.turns));
      if (flow.phase !== 'turn' || hero?.id !== from || !choicesFor().includes(data?.choice)) return; // not your turn, or not a real choice
      const { line, won } = act(g, hero, data.choice);
      log(line);
      if (won) {
        g.winner = hero.id;
        flow.go('won');
      } else nextTurn();
    });
    party.on('left', (id) => {
      if (flow.phase === 'turn' && turns.current(g.turns) === id) {
        log(`${heroOf(id).name} left and is skipped.`);
        nextTurn();
      }
    });

    function show() {
      const hero = heroOf(g.winner ?? turns.current(g.turns));
      status.textContent = g.winner ? `${hero.name} wins!` : `${hero.name}'s turn (rolled ${g.roll})`;
      clock?.destroy();
      clock = flow.phase === 'turn' ? timer(timerSlot, { endsAt: flow.endsAt }) : null;
      logList.replaceChildren(...g.log.map((line) => el('li', {}, line)));
      drawBoard(board, g.heroes);
      for (const h of g.heroes) {
        const mine = h === hero && !g.winner;
        party.setState(h.id, {
          color: h.color,
          text: g.winner ? (g.winner === h.id ? 'You found the treasure!' : `${hero.name} found the treasure.`) : mine ? `Your turn! You rolled ${g.roll}.` : `${hero.name}'s turn…`,
          choices: mine ? choicesFor() : [],
        });
      }
      party.save(g);
    }

    // Redraw when the screen changes size (the canvas fills its box).
    new ResizeObserver(() => drawBoard(board, g.heroes)).observe(board);

    // A new game, or a reload: the interrupted player gets their turn again (a fresh roll);
    // the end screen carries on where it was.
    if (restored && flow.phase === 'won') {
      show();
      flow.resume();
    } else flow.go('turn');
  }

  // TEMPLATE: how the board looks. Simple shapes on a canvas: rounded squares for walls, a star
  // for the treasure, a circle with an initial for each hero.
  function drawBoard(canvas, heroes) {
    const box = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(box.width * dpr);
    canvas.height = Math.round(box.height * dpr);
    const g = canvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = MAP[0].length;
    const rows = MAP.length;
    const size = Math.min(box.width / cols, box.height / rows); // one square, in CSS pixels
    const left = (box.width - size * cols) / 2;
    const top = (box.height - size * rows) / 2;
    const at = (x, y) => [left + x * size, top + y * size];
    g.clearRect(0, 0, box.width, box.height);
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const [px, py] = at(x, y);
        if (MAP[y][x] === '#') {
          g.fillStyle = '#6d5a4e';
          g.beginPath();
          g.roundRect(px + 1, py + 1, size - 2, size - 2, size * 0.2);
          g.fill();
        } else if (MAP[y][x] === '$') {
          star(g, px + size / 2, py + size / 2, size * 0.45, '#ffd84d');
        }
      }
    }
    for (const h of heroes) {
      const [px, py] = at(h.x, h.y);
      g.fillStyle = h.color;
      g.beginPath();
      g.arc(px + size / 2, py + size / 2, size * 0.42, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = '#fff';
      g.font = `bold ${Math.round(size * 0.5)}px system-ui, sans-serif`;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText((h.name.trim()[0] || '?').toUpperCase(), px + size / 2, py + size / 2 + 1);
    }
  }

  /** A five-pointed star centred on (x, y). */
  function star(g, x, y, r, color) {
    g.fillStyle = color;
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      const d = i % 2 === 0 ? r : r * 0.45;
      g.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
    }
    g.closePath();
    g.fill();
  }

  function phone() {
    const { el } = party.ui;
    const status = el('p', { class: 'big-text center', role: 'status' }, 'Get ready…');
    const buttons = el('div', { class: 'dirs' });
    document.getElementById('app').append(el('div', { class: 'screen' }, status, el('div', { class: 'grow' }), buttons));
    party.on('state', (s) => {
      status.textContent = s.text;
      status.style.color = s.color;
      // TEMPLATE: the action buttons (here, directions in a cross).
      const spot = { North: '1 / 2', West: '2 / 1', East: '2 / 3', South: '3 / 2' };
      buttons.replaceChildren(...s.choices.map((c) => el('button', { class: 'big', style: { gridArea: spot[c] ?? 'auto' }, onClick: () => party.send({ choice: c }) }, c)));
    });
  }
</script>
