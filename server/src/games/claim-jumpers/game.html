<!--
  CLAIM JUMPERS: blind claim bids (plan §36c; design: generator/spec/designs/claim-jumpers.md).
  One file, two roles:
   - the big screen (role "host") is the referee. Each round it stakes out the claims, collects
     everyone's secret plan (how many prospectors on each claim, and maybe the dynamite), then
     reveals the claims one at a time: the biggest crew takes the gold, a tie for biggest is a
     claim jump (nobody gets it), dynamite blows a claim up.
   - each phone (role "player") spreads its prospectors with − / + steppers and locks in.

<script>
  'use strict';

  // ---- Shared: the rules (pure functions) ------------------------------------------------
  const COLORS = [
    ['#ff8a1f', 'circle', 'Orange'], ['#3db8ff', 'square', 'Blue'], ['#ff5fa2', 'triangle', 'Pink'],
    ['#b8e02e', 'diamond', 'Lime'], ['#a77bff', 'star', 'Violet'], ['#f1f1f1', 'plus', 'White'],
  ];
  const ROUNDS = 7;
  const CREW = 5; // prospectors a round; the player in last place gets one more
  const LETTERS = 'ABCDEFG';
  const INTRO_MS = 12000, PICK_MS = 25000, STEP_MS = 1700, SCORES_MS = 5000, END_MS = 12000;
  /** The reveal: one claim at a time, then a beat to read the last one. */
  const revealMs = (claims) => claims * STEP_MS + 1800;

  /**
   * The claims for a round: players + 1 of them, each worth 1–5 gold, and one "?" worth 0–8
   * (shown only at the reveal). The last round is the Mother Lode: every value doubled.
   * @returns {{ value: number, mystery: boolean }[]}
   */
  function makeClaims(n, round, rand = Math.random) {
    const count = n + 1;
    const pool = [1, 2, 3, 4, 5];
    const claims = [];
    for (let k = 0; k < count - 1; k++) claims.push({ value: pool[Math.floor(rand() * pool.length)], mystery: false });
    claims.splice(Math.floor(rand() * count), 0, { value: Math.floor(rand() * 9), mystery: true });
    if (round === ROUNDS) for (const c of claims) c.value *= 2;
    return claims;
  }

  /** How many prospectors each player gets this round: CREW, +1 for last place (not when all are tied). */
  function crewSizes(scores) {
    const low = Math.min(...scores);
    const allTied = scores.every((s) => s === low);
    return scores.map((s) => (s === low && !allTied ? CREW + 1 : CREW));
  }

  /**
   * A phone's plan, checked: { crew: [count per claim], tnt: claim index | null }.
   * At most `size` prospectors in all; dynamite only while you still have it, and never on a
   * claim you send prospectors to (they'd blow up with it). Returns null if it's not valid.
   */
  function checkPlan(plan, claims, size, hasTnt) {
    if (!plan || typeof plan !== 'object' || !Array.isArray(plan.crew) || plan.crew.length !== claims) return null;
    if (!plan.crew.every((x) => Number.isInteger(x) && x >= 0)) return null;
    if (plan.crew.reduce((a, b) => a + b, 0) > size) return null;
    const tnt = plan.tnt ?? null;
    if (tnt !== null && (!hasTnt || !Number.isInteger(tnt) || tnt < 0 || tnt >= claims || plan.crew[tnt] > 0)) return null;
    return { crew: [...plan.crew], tnt };
  }

  /**
   * Reveals a round: for every claim, who sent how many, and who takes it.
   * Dynamite: nobody gets it. Otherwise the biggest crew takes the gold; a tie for biggest is a
   * claim jump and nobody gets it. Returns the results and each player's gold gained.
   */
  function resolveRound(claims, plans, n) {
    const gains = Array(n).fill(0);
    const results = claims.map((claim, i) => {
      const crews = [];
      for (let p = 0; p < n; p++) if (plans[p]?.crew[i] > 0) crews.push([p, plans[p].crew[i]]);
      crews.sort((a, b) => b[1] - a[1] || a[0] - b[0]);
      const boom = [...Array(n).keys()].filter((p) => plans[p]?.tnt === i);
      let winner = -1;
      let jumped = [];
      if (boom.length === 0 && crews.length > 0) {
        const top = crews.filter(([, k]) => k === crews[0][1]).map(([p]) => p);
        if (top.length === 1) winner = top[0];
        else jumped = top;
      }
      if (winner >= 0) gains[winner] += claim.value;
      return { value: claim.value, mystery: claim.mystery, crews, winner, jumped, boom };
    });
    return { results, gains };
  }

  /** Everyone, best first: gold, then claims won, then seat. */
  function standings(scores, won) {
    return [...scores.keys()].sort((a, b) => scores[b] - scores[a] || won[b] - won[a] || a - b);
  }

  const plural = (n, word, many = `${word}s`) => `${n} ${n === 1 ? word : many}`;
  /** Sets a player colour on an element (style objects can't hold CSS variables). */
  const tint = (node, color) => (node.style.setProperty('--c', color), node);
  const ordinal = (n) => `${n}${['th', 'st', 'nd', 'rd'][n % 100 > 10 && n % 100 < 14 ? 0 : Math.min(n % 10, 4) % 4] ?? 'th'}`;

  // ---- Shared: drawing ----------------------------------------------------------------------
  function chip(p) {
    const { el } = party.ui;
    return tint(el('span', { class: 'chip' }, el('span', { class: `shape s-${COLORS[p][1]}` })), COLORS[p][0]);
  }
  const nug = () => party.ui.el('span', { class: 'nug', 'aria-hidden': 'true' });
  const tntIcon = () => party.ui.el('span', { class: 'tnt', 'aria-hidden': 'true' });

  party.ready(({ role, me, restored }) => {
    document.body.className = role;
    if (role === 'host') bigScreen(restored);
    else phone(me);
  });

  // ---- The big screen: the referee and the map ------------------------------------------
  function bigScreen(restored) {
    const { el, sound } = party.ui;
    const ids = party.players.map((p) => p.id);
    const n = ids.length;
    const nameOf = (p) => party.players[p]?.name ?? '?';
    const connected = (p) => party.players[p]?.connected !== false;

    /** The whole game, as plain JSON (party.save). */
    let g = restored && restored.v === 2 && Array.isArray(restored.scores) ? restored : newGame();
    let ended = false;

    function newGame() {
      const now = party.now();
      return {
        v: 2,
        round: 0,
        phase: 'intro',
        at: now,
        endsAt: now + INTRO_MS,
        claims: [],
        sizes: Array(n).fill(CREW),
        plans: {}, // player → their plan so far (secret until the reveal)
        locked: {}, // player → true once they press Lock in
        hasTnt: Array(n).fill(true),
        scores: Array(n).fill(0),
        won: Array(n).fill(0), // claims won, for ties
        last: null, // { results, gains }
      };
    }

    function enter(phase, ms, now = party.now()) {
      g.phase = phase;
      g.at = now;
      g.endsAt = now + ms;
      changed();
    }

    function startRound(now = party.now()) {
      g.round += 1;
      g.claims = makeClaims(n, g.round);
      g.sizes = crewSizes(g.scores);
      g.plans = {};
      g.locked = {};
      g.last = null;
      enter('pick', PICK_MS, now);
    }

    function reveal(now = party.now()) {
      const plans = [...Array(n).keys()].map((p) => g.plans[p] ?? null);
      const { results, gains } = resolveRound(g.claims, plans, n);
      for (let p = 0; p < n; p++) {
        g.scores[p] += gains[p];
        if (plans[p]?.tnt !== null && plans[p]?.tnt !== undefined) g.hasTnt[p] = false;
      }
      for (const r of results) if (r.winner >= 0) g.won[r.winner] += 1;
      g.last = { results, gains };
      enter('reveal', revealMs(g.claims.length), now);
    }

    function timeUp(now) {
      if (g.phase === 'intro') return startRound(now);
      if (g.phase === 'pick') return reveal(now);
      if (g.phase === 'reveal') return enter('scores', SCORES_MS, now);
      if (g.phase === 'scores') return g.round >= ROUNDS ? enter('end', END_MS, now) : startRound(now);
      if (g.phase === 'end' && !ended) {
        ended = true;
        g.phase = 'over';
        party.save(g);
        const order = standings(g.scores, g.won);
        party.end({ rankings: order.map((p) => ids[p]), scores: Object.fromEntries(order.map((p) => [ids[p], g.scores[p]])) });
      }
    }

    function checkEarly() {
      if (g.phase !== 'pick') return;
      const here = [...Array(n).keys()].filter(connected);
      if (here.length > 0 && here.every((p) => g.locked[p])) reveal();
    }

    // -- What phones send: every plan is checked. A draft counts if time runs out. --
    party.on('event', (from, data) => {
      const p = ids.indexOf(from);
      if (p < 0 || ended || g.phase !== 'pick' || g.locked[p] || !data || typeof data !== 'object') return;
      const plan = checkPlan(data.plan, g.claims.length, g.sizes[p], g.hasTnt[p]);
      if (!plan) return;
      g.plans[p] = plan;
      if (data.lock === true) {
        g.locked[p] = true;
        sound('tap');
      }
      changed();
      checkEarly();
    });

    party.on('players', () => {
      changed();
      checkEarly();
    });

    // -- Every phone: the public claims, plus its own plan and news. --
    function newsFor(p) {
      if (!g.last) return [];
      const out = [];
      g.last.results.forEach((r, i) => {
        const mine = r.crews.find(([q]) => q === p)?.[1] ?? 0;
        const claim = `Claim ${LETTERS[i]}`;
        if (r.boom.includes(p)) out.push(`You blew up ${claim}${r.boom.length > 1 ? ` (so did ${r.boom.filter((q) => q !== p).map(nameOf).join(' and ')})` : ''}.`);
        else if (r.boom.length && mine) out.push(`${r.boom.map(nameOf).join(' and ')} blew up ${claim} under your crew.`);
        else if (r.winner === p) out.push(`You took ${claim}: +${r.value} gold!`);
        else if (r.jumped.includes(p)) out.push(`${claim} was jumped: you tied with ${r.jumped.filter((q) => q !== p).map(nameOf).join(' and ')}.`);
        else if (mine) out.push(`${nameOf(r.winner)} outbid you on ${claim}.`);
      });
      if (out.length === 0) out.push('You sat this round out.');
      return out;
    }

    function phoneState(id) {
      const p = ids.indexOf(id);
      const s = {
        phase: g.phase,
        endsAt: g.endsAt,
        round: g.round,
        rounds: ROUNDS,
        me: p,
        gold: g.scores[p],
        hasTnt: g.hasTnt[p],
      };
      if (g.phase === 'pick') {
        s.claims = g.claims.map((c) => (c.mystery ? { mystery: true, lode: g.round === ROUNDS } : { value: c.value }));
        s.size = g.sizes[p];
        s.bonus = g.sizes[p] > CREW;
        s.plan = g.plans[p] ?? null;
        s.locked = Boolean(g.locked[p]);
      }
      if (g.phase === 'scores') {
        s.news = newsFor(p);
        s.gain = g.last.gains[p];
      }
      if (g.phase === 'end' || g.phase === 'over') {
        const order = standings(g.scores, g.won);
        s.place = order.indexOf(p) + 1;
        const top = order.filter((q) => g.scores[q] === g.scores[order[0]] && g.won[q] === g.won[order[0]]);
        s.won = top.includes(p);
        s.tied = s.won && top.length > 1;
      }
      return s;
    }

    function changed() {
      for (const id of ids) party.setState(id, phoneState(id));
      party.save(g);
      render();
    }

    // -- Drawing the room's screen. --
    const root = document.getElementById('host');
    const mapCanvas = document.getElementById('map');
    root.hidden = false;
    mapCanvas.hidden = false;
    const turnEl = el('div', { class: 'turn' });
    const barEl = el('div', { class: 'bar', 'data-bar': '' }, el('i'));
    root.append(el('div', { class: 'top' }, el('div', { class: 'brand' }, 'Claim Jumpers'), barEl, turnEl));
    const stage = el('div', { class: 'stage' });
    const side = el('div', { class: 'side' });
    const say = el('p', { class: 'say' });
    root.append(stage, side, say);
    let shown = '';
    let timers = [];

    function sidePanel() {
      // During the reveal, the scores from before it: the claims tell who won, one at a time.
      const shownScores = g.phase === 'reveal' && g.last ? g.scores.map((x, p) => x - g.last.gains[p]) : g.scores;
      const order = standings(shownScores, g.won);
      const lead = shownScores[order[0]];
      const allTied = order.every((p) => shownScores[p] === lead);
      side.replaceChildren(...order.map((p) => {
        let right;
        if (g.phase === 'pick') right = el('span', { class: `tick ${g.locked[p] ? 'on' : 'off'}`, 'aria-label': g.locked[p] ? 'locked in' : 'planning' });
        else if (g.phase === 'scores' && g.last?.gains[p]) right = el('span', { class: 'gain' }, `+${g.last.gains[p]}`);
        else right = el('span', { class: 'gain' });
        return el('div', { class: `row${shownScores[p] === lead && !allTied ? ' lead' : ''}${connected(p) ? '' : ' away'}` },
          chip(p),
          el('span', { class: 'name' }, nameOf(p), g.hasTnt[p] ? tntIcon() : null),
          el('span', { class: 'pts' }, nug(), String(shownScores[p])),
          right);
      }));
    }

    /** The claims as plots on the map, each slightly crooked, with room for the crews. */
    function plots() {
      return el('div', { class: 'claims' }, g.claims.map((c, i) => {
        const card = el('div', { class: `claim${c.mystery ? ' mystery' : ''}`, 'data-i': String(i) },
          el('div', { class: 'letter' }, `Claim ${LETTERS[i]}`),
          el('div', { class: 'value' }, nug(), el('span', { class: 'v' }, c.mystery ? '?' : String(c.value))),
          el('div', { class: 'crews' }),
          el('div', { class: 'verdict' }));
        card.style.setProperty('--tilt', `${[-1.5, 1, -0.5, 1.5, -1, 0.5, -1.2][i % 7]}deg`);
        return card;
      }));
    }

    function showResult(card, r, animate) {
      card.querySelector('.v').textContent = String(r.value);
      const crews = card.querySelector('.crews');
      crews.replaceChildren(...r.crews.map(([p, k], j) => {
        // The shape and colour say whose crew it is (the side panel has the names); a name won't fit 7 across.
        const row = el('div', { class: `crew${p === r.winner ? ' top' : ''}`, 'aria-label': `${nameOf(p)}: ${k}` }, chip(p), el('span', { class: 'n' }, String(k)));
        row.style.animationDelay = animate ? `${j * 120}ms` : '0ms';
        return row;
      }));
      const verdict = card.querySelector('.verdict');
      if (r.boom.length) {
        card.classList.add('blown-up');
        verdict.textContent = `BOOM! ${r.boom.map(nameOf).join(' & ')} blew it up`;
        if (animate) {
          card.append(tint(el('span', { class: 'burst' }), 'var(--nugget)'));
          sound({ notes: [140, 70, 50], ms: 160, type: 'sawtooth', volume: 0.35 });
        }
      } else if (r.winner >= 0) {
        card.classList.add('won');
        verdict.textContent = `${nameOf(r.winner)} +${r.value}`;
        if (animate) sound(r.value > 0 ? 'coin' : 'pop');
      } else if (r.jumped.length) {
        card.classList.add('jumped');
        verdict.textContent = 'CLAIM JUMPED! Nobody gets it';
        if (animate) {
          card.append(tint(el('span', { class: 'burst' }), 'var(--jump)'));
          sound('buzz');
        }
      } else {
        card.classList.add('dim');
        verdict.textContent = 'Nobody came';
      }
    }

    function render() {
      sidePanel();
      const lode = g.round === ROUNDS;
      turnEl.textContent = g.round > 0 ? (lode ? 'MOTHER LODE' : `Round ${g.round} of ${ROUNDS}`) : '';
      turnEl.classList.toggle('lode', lode);
      barEl.classList.toggle('off', g.phase !== 'pick');
      if (g.phase === 'pick') {
        const locked = Object.keys(g.locked).length;
        say.textContent = `Send your prospectors on your phone (${locked} of ${n} locked in)`;
      }

      const wide = g.phase === 'intro' || g.phase === 'end' || g.phase === 'over';
      stage.classList.toggle('wide', wide);
      side.hidden = wide;

      const key = `${g.phase}-${g.at}`;
      if (key === shown) return;
      shown = key;
      timers.forEach(clearTimeout);
      timers = [];

      if (g.phase === 'intro') {
        stage.replaceChildren(el('div', { class: 'overlay' },
          el('h1', {}, 'Claim Jumpers'),
          el('ul', { class: 'rules' },
            el('li', {}, el('span', { class: 'ico' }, '5'), 'Secretly send your 5 prospectors to the claims.'),
            el('li', {}, el('span', { class: 'ico' }, nug()), 'The biggest crew on a claim takes its gold.'),
            el('li', {}, el('span', { class: 'ico', style: { color: 'var(--jump)' } }, '='), 'Tie for biggest? Claim jumped: nobody gets it.'),
            el('li', {}, el('span', { class: 'ico' }, tntIcon()), 'Dynamite, once a game: nobody gets that claim.'),
            el('li', {}, el('span', { class: 'ico' }, '+1'), `Last place gets a 6th prospector. Round ${ROUNDS}: double gold!`))));
        say.textContent = `${ROUNDS} rounds. Most gold wins.`;
      } else if (g.phase === 'pick') {
        stage.replaceChildren(plots());
        if (lode) sound('go');
      } else if (g.phase === 'reveal') {
        // Reloaded partway through: the claims already shown appear at once.
        const board = plots();
        stage.replaceChildren(board);
        const cards = [...board.children];
        const passed = Math.floor((party.now() - g.at) / STEP_MS);
        g.last.results.forEach((r, i) => {
          if (i < passed) showResult(cards[i], r, false);
          else timers.push(setTimeout(() => showResult(cards[i], r, true), (i - Math.max(passed, 0)) * STEP_MS + 400));
        });
        const jumps = g.last.results.filter((r) => r.jumped.length).length;
        say.textContent = jumps ? plural(jumps, 'claim') + ' jumped this round!' : 'The crews march in…';
      } else if (g.phase === 'scores') {
        const board = plots();
        stage.replaceChildren(board);
        g.last.results.forEach((r, i) => showResult(board.children[i], r, false));
        const best = Math.max(...g.last.gains);
        const top = g.last.gains.map((x, p) => [x, p]).filter(([x]) => x === best && x > 0).map(([, p]) => nameOf(p));
        say.textContent = top.length ? `Best round: ${top.join(' and ')} (+${best})` : 'Nobody struck gold this round!';
      } else if (g.phase === 'end' || g.phase === 'over') {
        const order = standings(g.scores, g.won);
        const winners = order.filter((p) => g.scores[p] === g.scores[order[0]] && g.won[p] === g.won[order[0]]);
        stage.replaceChildren(el('div', { class: 'overlay' },
          el('h2', {}, winners.length > 1 ? `${winners.map(nameOf).join(' and ')} tie!` : `${nameOf(winners[0])} wins!`),
          el('div', { class: 'row lead', style: { fontSize: '1.8rem' } }, chip(winners[0]), el('span', { class: 'name' }, nameOf(winners[0])), el('span', { class: 'pts' }, nug(), `${g.scores[winners[0]]} gold`), el('span'))));
        say.textContent = 'The rush is over';
        timers.push(setTimeout(() => sound('win'), 300));
      }
    }

    // -- The map behind everything: slow contour lines. --
    const ctx = mapCanvas.getContext('2d');
    const hills = [[0.15, 0.25, 0.7], [0.85, 0.75, 0.9], [0.8, 0.15, 0.5], [0.2, 0.85, 0.6]];
    function drawMap(t) {
      const dpr = window.devicePixelRatio || 1;
      const w = mapCanvas.clientWidth, h = mapCanvas.clientHeight;
      if (mapCanvas.width !== Math.round(w * dpr) || mapCanvas.height !== Math.round(h * dpr)) {
        mapCanvas.width = Math.round(w * dpr);
        mapCanvas.height = Math.round(h * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#123238';
      ctx.fillRect(0, 0, w, h);
      ctx.lineWidth = 1.5;
      const unit = Math.min(w, h);
      for (const [hx, hy, size] of hills) {
        for (let k = 1; k <= 6; k++) {
          ctx.strokeStyle = `rgba(169, 195, 189, ${0.05 + k * 0.012})`;
          ctx.beginPath();
          for (let a = 0; a <= 64; a++) {
            const th = (a / 64) * Math.PI * 2;
            const wob = 1 + 0.12 * Math.sin(th * 3 + k + t / 9000) + 0.06 * Math.sin(th * 5 - k * 0.7);
            const r = (k / 6) * size * unit * 0.45 * wob;
            const x = hx * w + Math.cos(th) * r, y = hy * h + Math.sin(th) * r * 0.8;
            if (a === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
      }
    }
    let lastSecond = -1;
    function loop(t) {
      drawMap(t);
      const now = party.now();
      const frac = Math.max(0, Math.min(1, (g.endsAt - now) / Math.max(1, g.endsAt - g.at)));
      barEl.firstChild.style.width = `${frac * 100}%`;
      if (g.phase === 'pick') {
        const sec = Math.ceil((g.endsAt - now) / 1000);
        if (sec <= 5 && sec > 0 && sec !== lastSecond) sound('tick');
        lastSecond = sec;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // -- The referee's heartbeat: deadlines. --
    setInterval(() => {
      if (ended || g.phase === 'over') return;
      if (party.now() >= g.endsAt) timeUp(party.now());
    }, 200);

    if (g.phase === 'over') {
      // Reloaded after the end: show the end again and finish.
      g.phase = 'end';
      g.at = party.now();
      g.endsAt = g.at + 3000;
    }
    changed();
  }

  // ---- A phone: your prospectors, and your secret plan ----------------------------------
  function phone(me) {
    const { el, timer, sound } = party.ui;
    const root = document.getElementById('phone');
    root.hidden = false;
    let s = null;
    let plan = null; // this round's plan as you build it: { crew: [...], tnt }
    let planFor = null;
    let timerFor = null;
    let tm = null;

    const head = el('div', { class: 'me' });
    const status = el('p', { class: 'status' });
    const clock = el('div');
    const body = el('div', { class: 'stack' });
    root.append(head, status, clock, body);
    status.textContent = 'Waiting for the big screen…';

    party.on('state', (state) => {
      s = state;
      draw();
    });

    const used = () => plan.crew.reduce((a, b) => a + b, 0);
    function change(fn) {
      if (!s || s.phase !== 'pick' || s.locked) return;
      fn();
      sound('tap');
      party.send({ plan }); // a draft: it counts if time runs out before you lock in
      draw();
    }

    function draw() {
      const myName = party.players.find((p) => p.id === me)?.name ?? 'You';
      head.replaceChildren(chip(s.me), el('span', {}, myName), el('span', { class: 'pts' }, nug(), String(s.gold)));

      // The clock: only while planning.
      if (s.phase === 'pick') {
        if (timerFor !== s.endsAt) {
          tm?.destroy();
          clock.replaceChildren();
          tm = timer(clock, { endsAt: s.endsAt });
          timerFor = s.endsAt;
        }
      } else if (tm) {
        tm.destroy();
        tm = null;
        timerFor = null;
        clock.replaceChildren();
      }

      if (s.phase === 'intro') {
        status.textContent = 'Get ready!';
        body.replaceChildren(el('p', { class: 'note' }, 'Each round, send your prospectors to the claims. The biggest crew takes the gold; a tie for biggest gets nothing.'));
      } else if (s.phase === 'pick') {
        if (planFor !== s.round) {
          plan = s.plan ? { crew: [...s.plan.crew], tnt: s.plan.tnt } : { crew: s.claims.map(() => 0), tnt: null };
          planFor = s.round;
        }
        drawPlan();
      } else if (s.phase === 'reveal') {
        status.textContent = `${s.round === s.rounds ? 'Mother Lode' : `Round ${s.round}`}: look up!`;
        body.replaceChildren(el('p', { class: 'note' }, 'The crews march in on the big screen…'));
      } else if (s.phase === 'scores') {
        status.textContent = s.gain > 0 ? `+${s.gain} gold this round` : 'No gold this round';
        body.replaceChildren(el('ul', { class: 'news' }, s.news.map((line) => el('li', {}, line))));
      } else if (s.phase === 'end' || s.phase === 'over') {
        status.textContent = 'Game over';
        body.replaceChildren(el('div', { class: 'result' }, el('b', {}, s.won ? (s.tied ? 'You tied for 1st!' : 'You win!') : `You came ${ordinal(s.place)}`), el('span', { class: 'muted' }, `${s.gold} gold`)));
      }
    }

    function drawPlan() {
      const lode = s.round === s.rounds;
      status.textContent = s.locked ? 'Locked in. Watch the others sweat.' : `${lode ? 'MOTHER LODE (double gold)' : `Round ${s.round} of ${s.rounds}`}: send your crew`;
      const left = s.size - used();
      const color = COLORS[s.me][0];
      const men = el('span', { class: 'men' }, Array.from({ length: s.size }, (_, k) => tint(el('span', { class: `man${k < left ? '' : ' out'}` }), color)));
      const nodes = [el('p', { class: 'left' }, men, `${left} of ${s.size} left${s.bonus ? ' (last place: +1!)' : ''}`)];

      nodes.push(el('div', { class: 'plots' }, s.claims.map((c, i) => {
        const k = plan.crew[i];
        const blown = plan.tnt === i;
        const name = `Claim ${LETTERS[i]}`;
        const row = el('div', { class: `plot${k ? ' has' : ''}${blown ? ' blown' : ''}`, 'data-i': String(i) },
          el('span', { class: 'val' }, nug(), c.mystery ? '?' : String(c.value)),
          el('span', { class: 'lbl' }, name, el('small', {}, c.mystery ? `worth 0–${c.lode ? 16 : 8}` : blown ? 'dynamite!' : `${c.value} gold`)),
          el('span', { class: 'step' },
            el('button', { type: 'button', class: 'secondary', 'aria-label': `Fewer on ${name}`, disabled: s.locked || k === 0, onClick: () => change(() => (plan.crew[i] -= 1)) }, '−'),
            el('span', { class: 'n', 'aria-label': `${name}: ${plural(k, 'prospector')}` }, String(k)),
            el('button', { type: 'button', 'aria-label': `More on ${name}`, disabled: s.locked || left === 0 || blown, onClick: () => change(() => (plan.crew[i] += 1)) }, '+')),
          s.hasTnt
            ? el('button', { type: 'button', class: 'boom', 'aria-label': `Dynamite on ${name}`, 'aria-pressed': blown ? 'true' : 'false', disabled: s.locked, onClick: () => change(() => {
              if (blown) plan.tnt = null;
              else {
                plan.tnt = i;
                plan.crew[i] = 0; // nobody stands on the dynamite
              }
            }) }, tntIcon())
            : el('span'));
        return tint(row, color);
      })));

      if (s.locked) nodes.push(el('button', { type: 'button', class: 'big', disabled: true }, 'Locked in ✓'));
      else {
        nodes.push(el('button', { type: 'button', class: 'big', onClick: () => { sound('tap'); party.send({ plan, lock: true }); } }, used() === 0 && plan.tnt === null ? 'Lock in (sit this one out)' : 'Lock in'));
        nodes.push(el('p', { class: 'note' }, s.hasTnt ? 'Your dynamite works once a game: nobody gets the claim it blows up.' : 'Your dynamite is used up.'));
      }
      body.replaceChildren(...nodes);
    }
  }
</script>
