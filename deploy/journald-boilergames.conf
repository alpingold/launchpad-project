# How long the server keeps its system log (the journal), installed as
# /etc/systemd/journald.conf.d/boilergames.conf. Without it the journal has no time limit, only a
# size limit, and a quiet server would keep lines for years. The privacy page says how long logs
# are kept, so the limit is set here, not left to a default.
#
# A new log file is started each day, and files older than 30 days are deleted.
[Journal]
MaxFileSec=1day
MaxRetentionSec=30day
