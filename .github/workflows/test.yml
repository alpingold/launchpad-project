# Type-checks, builds and tests every package, and runs the browser tests, on every push and pull request.
name: Tests

on:
  push:
  pull_request:

# Every action is pinned to the exact commit of a release (named in the comment beside it) that was
# at least two weeks old when chosen. A tag like @v7 follows each new release the day it comes out,
# and any tag can be moved to different code later; a commit id cannot. The release job can write to
# this repository, so what runs in it matters most.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The browser tests, in Chromium, Firefox and WebKit, each in a fresh and a saved profile. The walls
  # around a Game (nothing gets out of the Game frame, nothing passes between Games) differ from one
  # browser to another, so they are checked on every push, not only on one person's machine.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright's own image, which already holds the three browsers and the system libraries they
    # need: downloading them on every run took 21 minutes the first time. The tag must be the
    # @playwright/test version in package.json, or the tests won't find their browsers.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The browser tests start the real server, which imports the other packages' compiled output.
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: e2e/test-results/
          retention-days: 7

  # Publishes what was just tested, for the server to fetch. Only for the branch the site runs from,
  # and only once both jobs above are green. The server checks for a new release every minute,
  # installs it, and goes back to the one before if the site doesn't come up (deploy/).
  # Nothing here can reach the server, and GitHub holds no AWS credentials: the server fetches.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/rewrite'
    needs: [test, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      # The server is ARM; this machine is x86. The release carries the ARM builds of the two
      # programs the Playtest runs (deploy/package-release.sh).
      RELEASE_CPU: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: RELEASE_ID=${{ github.sha }} ./deploy/package-release.sh
      # Skip if a newer commit was released while this one was being tested: never step backwards.
      - name: Publish the release
        run: |
          git fetch --quiet origin rewrite
          if [ "$(git rev-parse origin/rewrite)" != "${{ github.sha }}" ]; then
            echo "A newer commit is on rewrite; leaving the release to its run."
            exit 0
          fi
          gh release create "r-${{ github.sha }}" release.tar.gz release.tar.gz.sha256 RELEASE \
            --target "${{ github.sha }}" --title "Release ${GITHUB_SHA::7}" \
            --notes "Built and tested by CI from ${{ github.sha }}. The server installs it within a minute." --latest
      # Twenty releases are plenty to go back to.
      - name: Remove old releases
        run: |
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[20:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
