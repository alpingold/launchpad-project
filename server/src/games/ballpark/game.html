<script>
  'use strict';

  // ---- Shared ---------------------------------------------------------------------------
  const COLORS = ['#ff5a5f', '#4dabf7', '#ffd43b', '#c084fc', '#ff922b', '#f783ac', '#22d3ee', '#a3e635', '#f8f9fa', '#94a3b8'];
  const QUESTIONS_PER_GAME = 7;
  const INTRO_MS = 7000, GUESS_MS = 40000, BET_MS = 30000, REVEAL_MS = 11000, SCORES_MS = 6000, END_MS = 10000;
  const COUNT_MS = 2500, DROP_AT = 3000, WIN_AT = 3600, PAY_AT = 4400; // inside the reveal
  const CLOSEST_BONUS = 3, SMALL_ODDS = 6, TOKENS = 2, MAX_DIGITS = 10;
  const fmt = (n) => Number(n).toLocaleString('en-US');
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const signed = (n) => (n > 0 ? `+${n}` : n < 0 ? `−${-n}` : '±0');
  function shuffle(list) {
    const a = [...list];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // [question, answer, what the number counts]. Stable facts only (no populations or records),

    document.body.className = role;
    if (role === 'host') bigScreen(restored);

  // ---- The big screen: the referee and the ballpark --------------------------------------
  function bigScreen(restored) {
    const { el, sound } = party.ui;
    const ids = party.players.map((p) => p.id);
    const nameOf = (id) => party.players.find((p) => p.id === id)?.name ?? '?';
    const colorOf = (id) => COLORS[Math.max(0, ids.indexOf(id)) % COLORS.length];
    const connected = (id) => party.players.find((p) => p.id === id)?.connected !== false;

    /** The whole game, as plain JSON (party.save). */
    let g = restored && restored.v === 1 && Array.isArray(restored.qs) ? restored : newGame();
    let ended = false;

    function newGame() {
      const now = party.now();
      return {
        v: 1,
        qs: shuffle(QUESTIONS.map((_, i) => i)).slice(0, QUESTIONS_PER_GAME),
        n: 0, // which question (0-based)
        phase: 'intro',
        at: now,
        endsAt: now + INTRO_MS,
        scores: Object.fromEntries(ids.map((id) => [id, 0])),
        speed: Object.fromEntries(ids.map((id) => [id, 0])), // total ms to lock in guesses: the tiebreak
        last: {}, // id → points won or lost on the last question
        guesses: {}, // id → number, this question
        board: [], // [{ value (null: smaller than all), ids, odds }], this question
        bets: {}, // id → [{ slot, chips }], this question
        locked: {}, // id → true once their bets are locked
        win: -1, // the winning slot, at the reveal
      };
    }

    const question = () => QUESTIONS[g.qs[g.n]];

    function enter(phase, ms, now = party.now()) {
      g.phase = phase;
      g.at = now;
      g.endsAt = now + ms;
      changed();
      cue();
    }

    function startGuess(now = party.now()) {
      g.guesses = {};
      g.board = [];
      g.bets = {};
      g.locked = {};
      g.win = -1;
      enter('guess', GUESS_MS, now);
    }

    /** The odds board: "smaller than all" (×6), then each different guess, smallest first. */
    function buildBoard() {
      const values = [...new Set(Object.values(g.guesses))].sort((a, b) => a - b);
      const mid = (values.length - 1) / 2;
      g.board = [{ value: null, ids: [], odds: SMALL_ODDS }].concat(values.map((value, i) => ({
        value,
        ids: ids.filter((id) => g.guesses[id] === value),
        odds: Math.min(5, 2 + Math.floor(Math.abs(i - mid))),
      })));
    }

    function endGuess(now = party.now()) {
      for (const id of ids) if (!(id in g.guesses)) g.speed[id] += GUESS_MS;
      buildBoard();
      if (g.board.length === 1) return reveal(now); // nobody guessed: straight to the answer
      enter('bets', BET_MS, now);
    }

    function reveal(now = party.now()) {
      const answer = question()[1];
      // The winning slot: the largest guess that isn't over the answer, else "smaller than all".
      g.win = 0;
      g.board.forEach((slot, i) => { if (i > 0 && slot.value <= answer) g.win = i; });
      g.last = {};
      for (const id of ids) {
        let delta = 0;
        for (const bet of g.bets[id] ?? []) delta += bet.slot === g.win ? g.board[bet.slot].odds * (1 + bet.chips) : -bet.chips;
        if (g.win > 0 && g.board[g.win].ids.includes(id)) delta += CLOSEST_BONUS;
        g.scores[id] = Math.max(0, g.scores[id] + delta);
        g.last[id] = delta;
      }
      enter('reveal', REVEAL_MS, now);
    }

    function standings() {
      return [...ids].sort((a, b) => g.scores[b] - g.scores[a] || g.speed[a] - g.speed[b]);
    }

    function timeUp(now) {
      switch (g.phase) {
        case 'intro': return startGuess(now);
        case 'guess': return endGuess(now);
        case 'bets': return reveal(now);
        case 'reveal': return enter('scores', SCORES_MS, now);
        case 'scores':
          if (g.n + 1 >= g.qs.length) return enter('end', END_MS, now);
          g.n += 1;
          return startGuess(now);
        case 'end':
          if (ended) return;
          ended = true;
          g.phase = 'over';
          party.save(g);
          party.end({ rankings: standings(), scores: { ...g.scores } });
      }
    }

    // Early ends: every connected phone has locked in its guess, or its bets.
    function checkEarly() {
      const live = ids.filter(connected);
      if (!live.length) return;
      if (g.phase === 'guess' && live.every((id) => id in g.guesses)) endGuess();
      else if (g.phase === 'bets' && live.every((id) => g.locked[id])) reveal();
    }

    /** Bets from a phone, checked: at most two tokens, real slots, chips within their score. */
    function validBets(id, list) {
      if (!Array.isArray(list) || list.length > TOKENS) return null;
      let chips = 0;
      const out = [];
      for (const b of list) {
        if (!b || typeof b !== 'object') return null;
        if (!Number.isInteger(b.slot) || b.slot < 0 || b.slot >= g.board.length) return null;
        if (!Number.isInteger(b.chips) || b.chips < 0) return null;
        chips += b.chips;
        out.push({ slot: b.slot, chips: b.chips });
      }
      return chips <= g.scores[id] ? out : null;
    }

    party.on('event', (from, data) => {
      if (!ids.includes(from) || !data || typeof data !== 'object' || ended) return;
      const now = party.now();
      if (g.phase === 'guess' && typeof data.guess === 'string' && !(from in g.guesses)) {
        if (!/^\d{1,10}$/.test(data.guess)) return;
        g.guesses[from] = Number(data.guess);
        g.speed[from] += Math.max(0, Math.min(GUESS_MS, now - g.at));
        sound('blip');
        changed();
        return checkEarly();
      }
      if (g.phase === 'bets' && 'bets' in data && !g.locked[from]) {
        const bets = validBets(from, data.bets);
        if (!bets) return;
        g.bets[from] = bets;
        if (data.lock === true) {
          g.locked[from] = true;
          sound('tick');
        }
        changed();
        return checkEarly();
      }
    });

    party.on('players', () => {
      changed();
      checkEarly();
    });

    // -- Every phone: only its own state. --
    function phoneState(id) {
      const [q, answer, unit] = question();
      const s = {
        phase: g.phase,
        endsAt: g.endsAt,
        color: colorOf(id),
        score: g.scores[id],
        qNo: g.n + 1,
        qTotal: g.qs.length,
        question: q,
        unit,
      };
      if (g.phase === 'guess') s.guess = g.guesses[id] ?? null;
      if (g.phase === 'bets' || g.phase === 'reveal') {
        s.board = g.board.map((slot) => ({ value: slot.value, odds: slot.odds, names: slot.ids.map(nameOf) }));
        s.bets = g.bets[id] ?? [];
        s.locked = Boolean(g.locked[id]);
      }
      if (g.phase === 'reveal' || g.phase === 'scores') {
        s.answer = answer;
        s.delta = g.last[id] ?? 0;
        s.won = g.win > 0 ? g.board[g.win].value : null;
      }
      if (g.phase === 'scores' || g.phase === 'end' || g.phase === 'over') {
        s.place = standings().indexOf(id) + 1;
        s.players = ids.length;
      }
      if (g.phase === 'end' || g.phase === 'over') s.winner = nameOf(standings()[0]);
      return s;
    }

    function changed() {
      for (const id of ids) party.setState(id, phoneState(id));
      party.save(g);
      render();
    }

    // -- Sounds: public moments only. --
    let lastCue = '';
    function cue() {
      const key = `${g.phase}-${g.at}`;
      if (key === lastCue) return;
      lastCue = key;
      const since = party.now() - g.at;
      const later = (ms, fn) => ms >= since && setTimeout(fn, ms - since);
      if (g.phase === 'guess') sound('go');
      else if (g.phase === 'reveal') {
        later(DROP_AT, () => g.board.some((s, i) => i > g.win && i > 0) && sound('pop'));
        later(WIN_AT, () => sound(g.board.length > 1 ? 'coin' : 'buzz'));
      } else if (g.phase === 'end') sound('win');
    }

    // -- Drawing the big screen --
    const root = document.getElementById('host');
    root.hidden = false;
    let barEl = null;
    let bulbsEl = null;
    const seenChips = new Set(); // chips already on the board drop in once, not at every redraw

    function plates(revealing) {
      const since = party.now() - g.at;
      return el('div', { class: 'plates' }, g.board.map((slot, i) => {
        const small = slot.value === null;
        const over = revealing && i > g.win;
        const win = revealing && i === g.win;
        const chips = el('div', { class: 'chips' }, ids.flatMap((id) => (g.bets[id] ?? []).filter((b) => b.slot === i).map((_, k) => {
          const key = `${g.n}-${id}-${i}-${k}`;
          const fresh = !seenChips.has(key);
          seenChips.add(key);
          return el('span', { class: `chip${fresh && !revealing ? ' new' : ''}`, style: { background: colorOf(id) }, title: nameOf(id) });
        })));
        return el('div', { class: `plate${small ? ' small' : ''}${over ? ' over' : ''}${win ? ' win' : ''}`, style: { '--d': `${(over ? DROP_AT : WIN_AT) - since}ms` } },
          chips,
          el('div', { class: 'face' },
            el('div', { class: 'num' }, small ? 'Smaller than all' : fmt(slot.value)),
            el('div', { class: 'who' }, small ? 'every guess too high' : slot.ids.map(nameOf).join(', '))),
          el('div', { class: 'odds' }, `×${slot.odds}`));
      }));
    }

    function payouts() {
      const since = party.now() - g.at;
      return el('div', { class: 'pays' }, ids.filter((id) => g.last[id]).map((id, k) =>
        el('div', { class: `pay ${g.last[id] > 0 ? 'plus' : 'minus'}`, style: { '--d': `${PAY_AT + k * 120 - since}ms` } },
          el('span', { class: 'dot', style: { background: colorOf(id) } }), nameOf(id), ` ${signed(g.last[id])}`)));
    }

    function table(final) {
      const order = standings();
      return el('div', { class: 'table' }, order.map((id, k) =>
        el('div', { class: `row${k === 0 && final ? ' first' : ''}`, style: { animationDelay: `${k * 90}ms` } },
          el('span', { class: 'rk' }, String(k + 1)),
          el('span', { class: 'dot', style: { background: colorOf(id) } }),
          el('span', { class: 'nm' }, nameOf(id)),
          el('span', { class: 'pts' }, fmt(g.scores[id])),
          el('span', { class: `dl ${(g.last[id] ?? 0) >= 0 ? 'good' : 'bad'}` }, final ? '' : signed(g.last[id] ?? 0)))));
    }

    function render() {
      const p = g.phase;
      const [q, answer, unit] = question();
      barEl = el('div', { class: 'bar' }, el('i'));
      bulbsEl = el('div', { class: 'bulbs', 'aria-live': 'off' });
      const top = el('div', { class: 'sb' },
        el('div', { class: 'brand' }, 'BALLPARK'),
        bulbsEl,
        el('div', { class: 'qno' }, p === 'intro' ? 'Play ball' : p === 'end' || p === 'over' ? 'Final' : `Question ${g.n + 1} of ${g.qs.length}`),
        barEl);
      const stage = el('div', { class: 'stage' });
      const add = (...nodes) => stage.append(...nodes.filter(Boolean));
      const waitingOn = p === 'guess' ? (id) => id in g.guesses : p === 'bets' ? (id) => g.locked[id] : null;

      if (p === 'intro') {
        add(el('h1', { class: 'question' }, 'Guess the number. Then bet on the best guess.'),
          el('p', { class: 'rule' }, 'The winner is the guess ', el('b', {}, 'closest without going over'), '.'),
          el('p', { class: 'sub' }, `${QUESTIONS_PER_GAME} questions. Two free bets each time, and you can stake your points on them.`));
      } else if (p === 'guess') {
        add(el('h1', { class: 'question' }, q), el('p', { class: 'hint' }, `Answer in ${unit}`),
          el('p', { class: 'sub' }, `Guess on your phone. ${Object.keys(g.guesses).length} of ${ids.length} locked in.`));
      } else if (p === 'bets') {
        add(el('p', { class: 'sub' }, q), plates(false),
          el('p', { class: 'rule' }, 'Bet on the guess ', el('b', {}, 'closest without going over'), '. Two free bets each.'));
      } else if (p === 'reveal') {
        const nobody = g.board.length === 1;
        add(el('p', { class: 'sub' }, q),
          nobody ? el('h1', { class: 'question' }, 'Nobody guessed!') : plates(true),
          el('p', { class: 'answer-line', style: { '--d': `${WIN_AT - (party.now() - g.at)}ms` } },
            nobody ? `The answer: ${fmt(answer)} ${unit}.` : g.win === 0 ? 'Every guess was too high!' : `${g.board[g.win].ids.map(nameOf).join(' and ')} ${g.board[g.win].ids.length === 1 ? 'was' : 'were'} closest: +${CLOSEST_BONUS}`),
          payouts());
      } else if (p === 'scores') {
        add(el('h1', { class: 'question', style: { fontSize: '2.4rem' } }, g.n + 1 >= g.qs.length ? 'And the last question goes to…' : 'The standings'), table(false));
      } else {
        add(el('p', { class: 'champ' }, `${nameOf(standings()[0])} wins!`), table(true));
      }
      const strip = el('div', { class: 'strip' }, ids.map((id) =>
        el('div', { class: `pl${connected(id) ? '' : ' away'}` },
          el('span', { class: 'dot', style: { background: colorOf(id) } }),
          el('span', { class: 'nm' }, nameOf(id)),
          el('span', { class: 'sc' }, fmt(g.scores[id])),
          waitingOn ? el('span', { class: waitingOn(id) ? 'tick' : 'wait', 'aria-label': waitingOn(id) ? 'Locked in' : 'Thinking' }) : null)));
      root.replaceChildren(top, stage, strip);
      fitPlates();
      frame();
    }

    /** Shrinks a plate's number until it fits (a 10-digit guess among ten plates). */
    function fitPlates() {
      requestAnimationFrame(() => {
        for (const num of root.querySelectorAll('.plate:not(.small) .num')) {
          let size = 2.4;
          num.style.fontSize = `${size}rem`;
          while (num.scrollWidth > num.clientWidth && size > 0.8) {
            size -= 0.15;
            num.style.fontSize = `${size}rem`;
          }
        }
      });
    }

    // -- Every frame: the timer bar, and the bulbs (the answer counting up at the reveal). --
    let lastSecond = -1;
    function frame() {
      const now = party.now();
      const total = Math.max(1, g.endsAt - g.at);
      const left = g.endsAt - now;
      if (barEl) {
        const timed = g.phase === 'guess' || g.phase === 'bets';
        barEl.style.visibility = timed ? 'visible' : 'hidden';
        barEl.firstChild.style.width = `${Math.max(0, Math.min(1, left / total)) * 100}%`;
        barEl.classList.toggle('low', left < 5000);
        const sec = Math.ceil(left / 1000);
        if (timed && sec <= 5 && sec > 0 && sec !== lastSecond) sound('tick');
        lastSecond = sec;
      }
      if (bulbsEl) {
        let text = '';
        if (g.phase === 'guess' || g.phase === 'bets') text = String(Math.max(0, Math.ceil(left / 1000)));
        else if (g.phase === 'reveal') {
          const t = Math.max(0, Math.min(1, (now - g.at) / COUNT_MS));
          const eased = 1 - (1 - t) ** 3;
          text = fmt(Math.round(question()[1] * eased));
        } else if (g.phase === 'scores') text = fmt(question()[1]);
        if (bulbsEl.textContent !== text) bulbsEl.textContent = text;
      }
    }
    (function loop() {
      frame();
      requestAnimationFrame(loop);
    })();

    // -- The referee's heartbeat: deadlines. --
    setInterval(() => {
      if (ended || g.phase === 'over') return;
      const now = party.now();
      if (now >= g.endsAt) timeUp(now);
    }, 200);

    if (g.phase === 'over') {
      // Reloaded after the end: show the end again and finish.
      g.phase = 'end';
      g.endsAt = party.now() + 3000;
    }
    changed();
    cue();
  }

  // ---- A phone: the keypad and the betting slip ----------------------------------------
  function phone(me) {
    const { el, timer, sound } = party.ui;
    const root = document.getElementById('phone');
    root.hidden = false;
    let s = null;
    let mainKey = '';
    let typed = { for: '', digits: '' }; // what's on the keypad, for this question
    let slip = { for: '', bets: [] }; // the bets being placed, for this question

    const head = el('div', { class: 'me' }, el('span', { class: 'dot' }), el('span', {}, party.players.find((p) => p.id === me)?.name ?? 'You'), el('span', { class: 'score' }));
    const main = el('div', { class: 'stack' });
    const foot = el('div', { class: 'stack' });
    root.append(head, main, el('div', { class: 'grow' }), foot);
    main.append(el('p', { class: 'say' }, 'Waiting for the big screen…'));

    party.on('state', (state) => {
      s = state;
      draw();
    });

    const qcard = () => el('div', { class: 'qcard' }, el('small', {}, `Question ${s.qNo} of ${s.qTotal}`), s.question);
    const say = (text) => el('p', { class: 'say' }, text);
    const timerBox = () => {
      const box = el('div');
      timer(box, { endsAt: s.endsAt });
      return box;
    };
    const slotLabel = (slot) => (slot.value === null ? 'Smaller than all' : fmt(slot.value));
    const chipsUsed = () => slip.bets.reduce((n, b) => n + b.chips, 0);
    const sendBets = (lock = false) => party.send({ bets: slip.bets, lock });

    // The keypad: digits, backspace, and Lock in. A physical keyboard works too.
    function press(key) {
      if (!s || s.phase !== 'guess' || s.guess !== null) return;
      if (key === 'ok') {
        if (!typed.digits) return;
        party.send({ guess: typed.digits });
        return;
      }
      if (key === 'del') typed.digits = typed.digits.slice(0, -1);
      else if (typed.digits.length < MAX_DIGITS) typed.digits = typed.digits === '0' ? key : typed.digits + key;
      sound('tap');
      draw(true);
    }
    document.addEventListener('keydown', (e) => {
      if (/^\d$/.test(e.key)) press(e.key);
      else if (e.key === 'Backspace') press('del');
      else if (e.key === 'Enter') press('ok');
    });

    function view() {
      const p = s.phase;
      const qid = `${s.qNo}`;
      if (typed.for !== qid) typed = { for: qid, digits: '' };
      if (slip.for !== qid && s.bets) slip = { for: qid, bets: s.bets.map((b) => ({ ...b })) };

      if (p === 'intro') return ['intro', () => [say('Guess the number, then bet on the guess closest without going over.'), el('p', { class: 'muted' }, 'You get two free bets every question.')], () => []];
      if (p === 'guess') {
        if (s.guess !== null) return ['guessed' + qid, () => [qcard(), say(`You guessed ${fmt(s.guess)} ${s.unit}.`), el('p', { class: 'muted' }, 'Waiting for the others…'), timerBox()], () => []];
        return ['guess' + qid + typed.digits, () => [qcard(), timerBox()], () => [
          el('div', { class: `display${typed.digits ? '' : ' empty'}`, 'aria-label': 'Your guess', role: 'status' }, typed.digits ? fmt(typed.digits) : `Your guess, in ${s.unit}`),
          el('div', { class: 'keys' },
            ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((d) => el('button', { type: 'button', onClick: () => press(d) }, d)),
            el('button', { type: 'button', 'aria-label': 'Delete', onClick: () => press('del') }, '⌫'),
            el('button', { type: 'button', onClick: () => press('0') }, '0'),
            el('button', { type: 'button', class: 'ok', disabled: !typed.digits, onClick: () => press('ok') }, 'Lock in')),
        ]];
      }
      if (p === 'bets') {
        if (s.locked) return ['locked' + qid, () => [say('Bets locked.'), betList(false), timerBox()], () => []];
        return ['bets' + qid + JSON.stringify(slip.bets) + s.score, () => [
          say(`Tap a guess to bet on it (${TOKENS - slip.bets.length} free ${TOKENS - slip.bets.length === 1 ? 'bet' : 'bets'} left).`),
          el('div', { class: 'slots' }, s.board.map((slot, i) => {
            const mine = slip.bets.filter((b) => b.slot === i).length;
            return el('button', {
              type: 'button',
              class: `slot${slot.value === null ? ' small' : ''}${mine ? ' on' : ''}`,
              'aria-label': `${slotLabel(slot)}, pays ${slot.odds} to 1${mine ? `, your bets: ${mine}` : ''}`,
              onClick: () => {
                if (slip.bets.length >= TOKENS) return;
                slip.bets.push({ slot: i, chips: 0 });
                sound('tap');
                sendBets();
                draw(true);
              },
            },
            el('span', { class: 'v' }, slotLabel(slot)),
            el('span', { class: 'o' }, `×${slot.odds}`),
            el('span', { class: 'g' }, Array.from({ length: mine }, () => el('span', { class: 'mine', style: { background: s.color } })), slot.value === null ? 'every guess too high' : slot.names.join(', ')));
          })),
          timerBox(),
        ], () => [betList(true), el('div', { class: 'two' },
          el('button', { type: 'button', class: 'big secondary', disabled: !slip.bets.length, onClick: () => { slip.bets = []; sendBets(); draw(true); } }, 'Take back'),
          el('button', { type: 'button', class: 'big', onClick: () => sendBets(true) }, slip.bets.length ? 'Lock bets' : 'Skip betting'))]];
      }
      if (p === 'reveal' || p === 'scores') {
        return ['res' + qid + p, () => [qcard(),
          say(`The answer: ${fmt(s.answer)} ${s.unit}.`),
          el('p', { class: `result ${s.delta > 0 ? 'plus' : s.delta < 0 ? 'minus' : ''}` }, signed(s.delta)),
          el('p', { class: 'muted' }, s.won === null ? 'Every guess was too high.' : `The winning guess was ${fmt(s.won)}.`),
          p === 'scores' ? say(`You're ${ordinal(s.place)} of ${s.players}.`) : null,
        ], () => []];
      }
      if (p === 'end' || p === 'over') {
        return ['end', () => [el('p', { class: 'result' }, s.place === 1 ? 'You win!' : `You're ${ordinal(s.place)}.`), say(`${s.winner} wins with the best score.`), el('p', { class: 'muted' }, `You finished with ${plural(s.score, 'point')}.`)], () => []];
      }
      return ['wait', () => [say('…')], () => []];
    }

    /** Your placed bets, each with a − chips + stepper (chips come from your score). */
    function betList(editable) {
      const bets = editable ? slip.bets : s.bets;
      if (!bets.length) return el('p', { class: 'muted' }, editable ? 'No bets yet.' : 'You skipped betting.');
      return el('div', { class: 'bets' }, bets.map((b, k) => {
        const slot = s.board[b.slot];
        const row = el('div', { class: 'bet' }, el('span', { class: 'lbl' }, `${slotLabel(slot)} ×${slot.odds}`));
        if (!editable) {
          row.append(el('span', { class: 'n' }, b.chips ? `+${plural(b.chips, 'chip')}` : ''));
          return row;
        }
        const step = (d) => {
          const next = b.chips + d;
          if (next < 0 || chipsUsed() + d > s.score) return;
          slip.bets[k] = { ...b, chips: next };
          sendBets();
          draw(true);
        };
        row.append(
          el('button', { type: 'button', 'aria-label': `Fewer chips on ${slotLabel(slot)}`, disabled: b.chips === 0, onClick: () => step(-1) }, '−'),
          el('span', { class: 'n', 'aria-label': `Chips on ${slotLabel(slot)}` }, plural(b.chips, 'chip')),
          el('button', { type: 'button', 'aria-label': `More chips on ${slotLabel(slot)}`, disabled: chipsUsed() >= s.score, onClick: () => step(1) }, '+'));
        return row;
      }));
    }

    const ordinal = (n) => `${n}${n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th'}`;

    function draw(force = false) {
      if (!s) return;
      head.querySelector('.dot').style.background = s.color;
      head.querySelector('.score').textContent = plural(s.score, 'point');
      const [key, top, bottom] = view();
      if (force || key !== mainKey) {
        mainKey = key;
        main.replaceChildren(...top().filter(Boolean));
        foot.replaceChildren(...bottom().filter(Boolean));
      }
    }
  }
</script>
