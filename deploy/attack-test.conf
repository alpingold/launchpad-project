# THROWAWAY SERVER ONLY. Never on the live server.
#
# A drop-in for boilergames-playtest@.service that starts the runner with --attack-test, which hands
# each Game Node's `process` and `require`, so deploy/attack-playtest.sh can try the wall directly
# instead of first having to get out of the `vm`. Install it as
#   /etc/systemd/system/boilergames-playtest@.service.d/attack-test.conf
# then `systemctl daemon-reload`. Remove it, or better, the whole throwaway server, afterwards.
[Service]
ExecStart=
ExecStart=/usr/local/bin/node --max-old-space-size=192 /opt/boilergames/current/playtest/dist/runner.js --attack-test
