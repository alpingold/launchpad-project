<!--
  PUNCHLINE: a writing-and-voting game (design: generator/spec/designs/punchline.md).
  One file, two roles:
   - the big screen (role "host") is the referee and the stage. It deals the prompts in a ring
     (each player answers 2, every prompt has 2 authors), runs every timer, shows each pair of
     answers WITHOUT names while the room votes, counts the votes, and keeps the scores.
   - each phone (role "player") shows only its own state (party.setState per player): the
     prompts it has to answer, the two answers to vote on, or the answers in the last round.

  function shuffle(list) {
    const a = [...list];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];

  // ---- The big screen: the referee and the stage ----------------------------------------
  function bigScreen(restored) {
    const { el, sound } = party.ui;
    const ids = party.players.map((p) => p.id);
    const nameOf = (id) => party.players.find((p) => p.id === id)?.name ?? '?';
    const colorOf = (id) => COLORS[Math.max(0, ids.indexOf(id)) % COLORS.length];
    const connected = (id) => party.players.find((p) => p.id === id)?.connected !== false;

    /** The whole game, as plain JSON (party.save). */
    let g = restored && restored.v === 1 && restored.scores ? restored : newGame();
    let ended = false;

    function newGame() {
      const now = party.now();
      return {
        v: 1,
        phase: 'intro',
        at: now,
        endsAt: now + INTRO_MS,
        round: 1,
        used: [], // prompt indexes used so far
        deal: [], // rounds 1–2: [{ prompt, a, b, ans: { [id]: { t, house } } }]
        match: 0, // which matchup is on stage
        votes: {}, // voter id → 'a' | 'b' (rounds 1–2) or the id they voted for (The Last Word)
        result: null, // the last reveal: { va, vb, sweep, gain: { [id]: points } } or { count: { [id]: n } }
        final: null, // { prompt, ans: { [id]: { t, house } }, order: [ids] }
        scores: Object.fromEntries(ids.map((id) => [id, 0])),
      };
    }

    function takePrompt() {
      let free = PROMPTS.map((_, i) => i).filter((i) => !g.used.includes(i));
      if (free.length === 0) free = PROMPTS.map((_, i) => i); // (can't happen in one game)
      const i = pick(free);
      g.used.push(i);
      return PROMPTS[i];
    }

    function enter(phase, ms, now = party.now()) {
      g.phase = phase;
      g.at = now;
      g.endsAt = now + ms;
      changed();
      cue(phase);
    }

    // -- The deal: a ring, so everyone writes 2 answers and odd counts work too. --
    function startWrite(round, now = party.now()) {
      g.round = round;
      g.votes = {};
      g.result = null;
      if (round < 3) {
        const ring = shuffle(ids);
        g.deal = ring.map((p, i) => ({ prompt: takePrompt(), a: p, b: ring[(i + 1) % ring.length], ans: {} }));
        g.match = 0;
        enter('write', WRITE_MS, now);
      } else {
        g.final = { prompt: takePrompt(), ans: {}, order: [] };
        enter('final-write', FINAL_WRITE_MS, now);
      }
    }
    /** The matchups this player writes for, by index. */
    const myMatchups = (id) => g.deal.map((m, k) => (m.a === id || m.b === id ? k : -1)).filter((k) => k >= 0);
    const todo = (id) => (g.phase === 'write' ? myMatchups(id).filter((k) => !g.deal[k].ans[id]) : g.phase === 'final-write' && !g.final.ans[id] ? [0] : []);

    function endWrite(now = party.now()) {
      // A prompt nobody answered in time gets an answer from the house.
      if (g.phase === 'write') {
        for (const m of g.deal) for (const id of [m.a, m.b]) if (!m.ans[id]) m.ans[id] = { t: pick(HOUSE), house: true };
        // Two house answers can't be the same in one matchup.
        for (const m of g.deal) while (m.ans[m.a].house && m.ans[m.b].house && m.ans[m.a].t === m.ans[m.b].t) m.ans[m.b].t = pick(HOUSE);
        startVote(now);
      } else {
        for (const id of ids) if (!g.final.ans[id]) g.final.ans[id] = { t: pick(HOUSE), house: true };
        g.final.order = shuffle(ids);
        g.votes = {};
        enter('final-vote', FINAL_VOTE_MS, now);
      }
    }

    function startVote(now = party.now()) {
      g.votes = {};
      g.result = null;
      enter('vote', VOTE_MS, now);
    }
    const voters = () => {
      if (g.phase === 'vote') {
        const m = g.deal[g.match];
        return ids.filter((id) => id !== m.a && id !== m.b);
      }
      return ids;
    };

    function endVote(now = party.now()) {
      const m = g.deal[g.match];
      const vals = Object.values(g.votes);
      const va = vals.filter((v) => v === 'a').length;
      const vb = vals.filter((v) => v === 'b').length;
      const per = g.round * 100;
      const sweep = va + vb >= 2 && (va === 0 || vb === 0) ? (va ? 'a' : 'b') : null;
      const gain = { [m.a]: va * per + (sweep === 'a' ? per : 0), [m.b]: vb * per + (sweep === 'b' ? per : 0) };
      for (const [id, n] of Object.entries(gain)) g.scores[id] += n;
      g.result = { va, vb, sweep, gain };
      enter('reveal', REVEAL_MS, now);
    }

    function endFinalVote(now = party.now()) {
      const count = Object.fromEntries(ids.map((id) => [id, 0]));
      for (const target of Object.values(g.votes)) count[target] += 1;
      for (const id of ids) g.scores[id] += count[id] * 300;
      g.result = { count };
      enter('final-reveal', FINAL_REVEAL_MS, now);
    }

    const ranking = () => ids.map((id, seat) => ({ id, seat })).sort((x, y) => g.scores[y.id] - g.scores[x.id] || x.seat - y.seat).map((x) => x.id);

    function timeUp(now) {
      switch (g.phase) {
        case 'intro': return startWrite(1, now);
        case 'write': case 'final-write': return endWrite(now);
        case 'vote': return endVote(now);
        case 'reveal':
          if (g.match + 1 < g.deal.length) {
            g.match += 1;
            return startVote(now);
          }
          return enter('scores', SCORES_MS, now);
        case 'scores': return startWrite(g.round + 1, now);
        case 'final-vote': return endFinalVote(now);
        case 'final-reveal': return enter('end', END_MS, now);
        case 'end':
          if (ended) return;
          ended = true;
          g.phase = 'over';
          party.save(g);
          party.end({ rankings: ranking(), scores: { ...g.scores } });
      }
    }

    // Early ends: everyone connected has written everything; every connected voter voted.
    function checkEarly() {
      const now = party.now();
      const live = ids.filter(connected);
      if ((g.phase === 'write' || g.phase === 'final-write') && live.every((id) => todo(id).length === 0)) endWrite(now);
      else if ((g.phase === 'vote' || g.phase === 'final-vote') && voters().filter(connected).every((id) => id in g.votes)) {
        if (g.phase === 'vote') endVote(now);
        else endFinalVote(now);
      }
    }

    // -- What phones send: every event is checked. --
    party.on('event', (from, data) => {
      if (!ids.includes(from) || !data || typeof data !== 'object' || ended) return;
      if ('k' in data && (g.phase === 'write' || g.phase === 'final-write')) {
        // An answer (or "Pick one for me") for one of this player's prompts that isn't answered yet.
        if (!todo(from).includes(data.k)) return;
        const t = data.house === true ? pick(HOUSE) : cleanAnswer(data.answer);
        if (!t) return;
        const box = g.phase === 'write' ? g.deal[data.k].ans : g.final.ans;
        box[from] = { t, house: false };
        changed();
        checkEarly();
      } else if ('vote' in data && g.phase === 'vote') {
        if (!voters().includes(from) || (data.vote !== 'a' && data.vote !== 'b')) return;
        g.votes[from] = data.vote;
        changed();
        checkEarly();
      } else if ('vote' in data && g.phase === 'final-vote') {
        if (typeof data.vote !== 'string' || !ids.includes(data.vote) || data.vote === from) return;
        g.votes[from] = data.vote;
        changed();
        checkEarly();
      }
    });

    party.on('players', () => {
      changed();
      checkEarly();
    });

    // -- Every phone: only its own state. --
    function phoneState(id) {
      const s = {
        phase: g.phase,
        endsAt: g.endsAt,
        round: g.round,
        color: colorOf(id),
        score: g.scores[id],
        place: 1 + ids.filter((o) => g.scores[o] > g.scores[id]).length, // ties share a place
        of: ids.length,
      };
      if (g.phase === 'write' || g.phase === 'final-write') {
        const left = todo(id);
        const total = g.phase === 'write' ? myMatchups(id).length : 1;
        s.total = total;
        s.n = total - left.length + 1;
        if (left.length) {
          s.k = left[0];
          s.prompt = g.phase === 'write' ? g.deal[left[0]].prompt : g.final.prompt;
        }
      }
      if (g.phase === 'vote') {
        const m = g.deal[g.match];
        s.prompt = m.prompt;
        s.mine = id === m.a || id === m.b;
        if (!s.mine) s.answers = [m.ans[m.a].t, m.ans[m.b].t];
        if (id in g.votes) s.voted = g.votes[id];
      }
      if (g.phase === 'reveal') s.prompt = g.deal[g.match].prompt;
      if (g.phase === 'final-reveal') s.prompt = g.final.prompt;
      if (g.phase === 'final-vote') {
        s.prompt = g.final.prompt;
        s.options = g.final.order.filter((p) => p !== id).map((p) => ({ id: p, t: g.final.ans[p].t }));
        if (id in g.votes) s.voted = g.votes[id];
      }
      return s;
    }

    function changed() {
      for (const id of ids) party.setState(id, phoneState(id));
      party.save(g);
      render();
    }

    // -- Sounds: big moments only. --
    let lastCue = '';
    function cue(phase) {
      const key = `${phase}-${g.at}`;
      if (key === lastCue) return;
      lastCue = key;
      if (phase === 'write' || phase === 'final-write') sound('go');
      else if (phase === 'reveal') {
        // (Read now: by the time the timers fire, g.result may belong to the next matchup.)
        const { va, vb, sweep } = g.result;
        for (let i = 0; i < va + vb; i++) setTimeout(() => sound('pop'), 200 + i * 120);
        setTimeout(() => sound(sweep ? { notes: [523, 659, 784, 1047], ms: 110, type: 'triangle' } : 'coin'), 1300);
      } else if (phase === 'final-reveal') {
        Object.values(g.votes).forEach((_, i) => setTimeout(() => sound('pop'), 200 + i * 120));
        setTimeout(() => sound('coin'), 1400);
      } else if (phase === 'end') setTimeout(() => sound('win'), 900);
    }

    // -- Drawing the big screen: HTML and CSS for the show, a canvas for the club behind. --
    const root = document.getElementById('host');
    root.hidden = false;

    function tok(id, cls = 'tok') {
      return el('div', { class: cls, style: { background: colorOf(id) } }, initial(nameOf(id)));
    }
    function badge(id, extra = null, cls = '') {
      return el('div', { class: `badge${connected(id) ? '' : ' away'}${cls}` }, tok(id), el('div', { class: 'nm' }, nameOf(id)), extra);
    }
    const bar = () => el('div', { class: 'bar', 'data-bar': '1' }, el('i'));
    const voterToks = () => voters().map((id) => el('div', { class: `tok${id in g.votes ? ' done' : ''}`, style: { background: colorOf(id) }, title: nameOf(id) }, initial(nameOf(id))));
    const voterRow = () => el('div', { class: 'voters' }, voterToks());
    const chipsFor = (who) => Object.entries(g.votes).filter(([, v]) => v === who).map(([voter], i) => el('div', { class: 'chip', style: { background: colorOf(voter), animationDelay: `${0.2 + i * 0.12}s` } }, initial(nameOf(voter))));
    const bubble = (answer, showHouse) => el('div', { class: 'bubble' }, showHouse && answer.house ? el('span', { class: 'house' }, 'picked by the house') : null, answer.t);

    // Only redraw when something you can see changed (so animations don't restart). While the
    // room votes, a new vote only ticks its voter's token: the answers mustn't pop in again.
    let shownKey = '';
    function render() {
      const key = JSON.stringify([g.phase, g.at, g.match, g.round, g.phase.endsWith('write') ? ids.map(todo) : 0, party.players.map((p) => p.connected)]);
      if (key === shownKey) {
        root.querySelector('.voters')?.replaceChildren(...voterToks());
        return;
      }
      shownKey = key;
      const top = el('div', { class: 'top' }, g.phase === 'intro' || g.phase === 'end' || g.phase === 'over' ? el('span') : el('div', { class: 'round' }, ROUND_NAME[g.round]), el('div', { class: 'logo' }, 'PUNCHLINE'));
      const stage = el('div', { class: 'stage' });
      const strip = el('div', { class: 'strip' });
      const p = g.phase;

      if (p !== 'intro' && p !== 'end' && p !== 'over') {
        for (const id of ids) {
          // During a reveal the strip shows the scores from before it: a jump there would
          // give away who wrote what before the names come in.
          const shown = g.scores[id] - (p === 'reveal' ? g.result.gain[id] ?? 0 : p === 'final-reveal' ? g.result.count[id] * 300 : 0);
          let extra = el('div', { class: 'pts' }, String(shown));
          if (p === 'write' || p === 'final-write') {
            const total = p === 'write' ? myMatchups(id).length : 1;
            const done = total - todo(id).length;
            extra = el('div', { class: 'dots' }, Array.from({ length: total }, (_, i) => el('span', { class: i < done ? 'on' : '' })));
          }
          strip.append(badge(id, extra));
        }
      }

      if (p === 'intro') {
        stage.append(
          el('h1', { class: 'title' }, 'PUNCHLINE'),
          el('ol', { class: 'how' },
            el('li', { style: { animationDelay: '0.5s' } }, el('b', {}, '1'), 'Answer 2 prompts on your phone.'),
            el('li', { style: { animationDelay: '0.8s' } }, el('b', {}, '2'), 'Your answer goes head-to-head with someone else’s.'),
            el('li', { style: { animationDelay: '1.1s' } }, el('b', {}, '3'), 'Everyone else votes for the funnier one.')),
          bar());
      } else if (p === 'write' || p === 'final-write') {
        stage.append(
          el('h1', { class: 'headline' }, 'Answer on your phones!'),
          el('p', { class: 'sub' }, p === 'write' ? `Two prompts each. Round ${g.round}: ${g.round * 100} points a vote.` : 'One prompt for everyone. 300 points a vote. Make it count!'),
          bar());
      } else if (p === 'vote' || p === 'reveal') {
        const m = g.deal[g.match];
        const r = p === 'reveal' ? g.result : null;
        const side = (who) => {
          const id = m[who];
          const won = r && r.va !== r.vb && (r.va > r.vb) === (who === 'a');
          const node = el('div', { class: `side ${who}${r ? (won ? ' win' : r.va === r.vb ? '' : ' lose') : ''}` }, bubble(m.ans[id], Boolean(r)));
          if (r) {
            node.append(el('div', { class: 'chips' }, chipsFor(who)), el('div', { class: 'author', style: { color: colorOf(id) } }, nameOf(id), el('span', { class: 'plus' }, `+${r.gain[id]}`)));
            if (r.sweep === who) node.style.position = 'relative';
            if (r.sweep === who) node.append(el('div', { class: 'stamp' }, 'SWEEP!'));
          }
          return node;
        };
        stage.append(
          el('p', { class: 'sub' }, `Matchup ${g.match + 1} of ${g.deal.length}`),
          el('h1', { class: 'prompt-h' }, m.prompt),
          el('div', { class: 'duel' }, side('a'), el('div', { class: 'vs' }, 'VS'), side('b')));
        if (p === 'vote') stage.append(el('p', { class: 'sub' }, 'Vote on your phone for the funnier answer!'), voterRow(), bar());
        else if (r.va + r.vb === 0) stage.append(el('p', { class: 'sub' }, 'No votes!'));
      } else if (p === 'final-vote' || p === 'final-reveal') {
        const r = p === 'final-reveal' ? g.result : null;
        const best = r ? Math.max(...Object.values(r.count)) : 0;
        stage.append(
          el('h1', { class: 'prompt-h' }, g.final.prompt),
          el('div', { class: 'wall' }, g.final.order.map((id, i) => {
            const node = el('div', { class: `side${r && best > 0 && r.count[id] === best ? ' win' : ''}` });
            const b = bubble(g.final.ans[id], Boolean(r));
            b.style.animationDelay = `${i * 0.1}s`;
            node.append(b);
            if (r) node.append(el('div', { class: 'chips' }, chipsFor(id)), el('div', { class: 'author', style: { color: colorOf(id) } }, nameOf(id), el('span', { class: 'plus' }, `+${r.count[id] * 300}`)));
            return node;
          })));
        if (p === 'final-vote') stage.append(el('p', { class: 'sub' }, 'Vote for your favourite (not your own)!'), voterRow(), bar());
      } else if (p === 'scores') {
        const top = Math.max(1, ...Object.values(g.scores));
        const rows = ranking().map((id) => {
          const fill = el('div', { class: 'fill', style: { background: colorOf(id), width: '0%' } });
          requestAnimationFrame(() => requestAnimationFrame(() => (fill.style.width = `${(g.scores[id] / top) * 100}%`)));
          return el('div', { class: 'brow' }, tok(id), el('span', {}, nameOf(id)), el('div', {}, fill), el('span', { class: 'n' }, String(g.scores[id])));
        });
        stage.append(el('h1', { class: 'headline' }, `After ${ROUND_NAME[g.round]}`), el('div', { class: 'board' }, rows), el('p', { class: 'sub' }, g.round === 1 ? 'Next round: double points!' : 'Next: The Last Word.'));
      } else {
        // Ties share a place, and everyone tied for first wins.
        const placeOf = (id) => 1 + ids.filter((o) => g.scores[o] > g.scores[id]).length;
        const order = ranking();
        const winners = order.filter((id) => placeOf(id) === 1);
        const rest = order.filter((id) => placeOf(id) > 1);
        stage.append(
          el('p', { class: 'sub' }, winners.length === 1 ? 'The funniest person in the room is…' : 'The funniest people in the room are…'),
          el('div', { class: 'row-win' }, winners.map((id) => el('div', { class: 'winner badge' }, tok(id), el('div', { class: 'nm', style: { color: colorOf(id) } }, nameOf(id))))),
          el('p', { class: 'headline', style: { fontSize: '2rem', color: 'var(--marquee)' } }, `${g.scores[winners[0]]} points`),
          el('div', { class: 'strip', style: { borderTop: 'none' } }, rest.map((id) => badge(id, el('div', { class: 'pts' }, `${ordinal(placeOf(id))} · ${g.scores[id]}`)))));
      }
      root.replaceChildren(top, stage, strip);
      frame();
    }

    // -- Every frame: the bars, the ticks, the club behind. --
    let lastSecond = -1;
    function frame(now = party.now()) {
      const total = Math.max(1, g.endsAt - g.at);
      const left = g.endsAt - now;
      const frac = Math.max(0, Math.min(1, left / total));
      for (const b of root.querySelectorAll('[data-bar] > i')) b.style.width = `${frac * 100}%`;
      if (['write', 'final-write', 'vote', 'final-vote'].includes(g.phase)) {
        const sec = Math.ceil(left / 1000);
        if (sec <= 5 && sec > 0 && sec !== lastSecond) sound('tick');
        lastSecond = sec;
      }
    }

    const club = document.getElementById('club');
    club.hidden = false;
    const ctx = club.getContext('2d');
    function drawClub(t) {
      const dpr = window.devicePixelRatio || 1;
      const w = club.clientWidth, h = club.clientHeight;
      if (club.width !== Math.round(w * dpr) || club.height !== Math.round(h * dpr)) {
        club.width = Math.round(w * dpr);
        club.height = Math.round(h * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // The curtain: folds that sway a little.
      const floor = h * 0.84;
      const folds = 16;
      const fw = w / folds;
      for (let i = 0; i < folds; i++) {
        // Each fold's highlight drifts a little, so the curtain seems to sway.
        const x = i * fw;
        const grad = ctx.createLinearGradient(x, 0, x + fw, 0);
        grad.addColorStop(0, '#3a0b24');
        grad.addColorStop(0.45 + Math.sin(t / 2400 + i) * 0.12, '#7a1c4a');
        grad.addColorStop(1, '#3a0b24');
        ctx.fillStyle = grad;
        ctx.fillRect(Math.floor(x), 0, Math.ceil(fw) + 1, floor);
      }
      // A valance across the top.
      ctx.fillStyle = '#5a1236';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(w, 0);
      ctx.lineTo(w, h * 0.05);
      for (let i = folds; i >= 0; i--) ctx.quadraticCurveTo(i * fw + fw / 2, h * 0.09, i * fw, h * 0.05);
      ctx.closePath();
      ctx.fill();
      // The stage floor: dark boards.
      ctx.fillStyle = '#1a0b14';
      ctx.fillRect(0, floor, w, h - floor);
      ctx.strokeStyle = 'rgba(255, 210, 63, 0.12)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let y = floor + 12; y < h; y += 16) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
      ctx.stroke();
      // Two spotlights sweeping slowly.
      for (const [base, speed] of [[0.3, 1], [0.7, -1.3]]) {
        const cx = w * (base + Math.sin(t / 3800 * speed) * 0.12);
        const glow = ctx.createRadialGradient(cx, h * 0.55, 0, cx, h * 0.55, Math.max(w, h) * 0.38);
        glow.addColorStop(0, 'rgba(255, 244, 216, 0.22)');
        glow.addColorStop(1, 'rgba(255, 244, 216, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);
      }
      // Marquee bulbs along the top, chasing.
      const n = Math.floor(w / 34);
      for (let i = 0; i < n; i++) {
        const on = (i + Math.floor(t / 220)) % 3 === 0;
        ctx.beginPath();
        ctx.arc((i + 0.5) * (w / n), 7, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = on ? '#ffd23f' : '#7a5a1a';
        ctx.shadowColor = '#ffd23f';
        ctx.shadowBlur = on ? 12 : 0;
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }
    function loop(t) {
      drawClub(t);
      frame();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // -- The referee's heartbeat: deadlines. --
    setInterval(() => {
      if (ended || g.phase === 'over') return;
      if (party.now() >= g.endsAt) timeUp(party.now());
      else checkEarly(); // e.g. a matchup whose only voter has left: nothing to wait for
    }, 250);

    if (g.phase === 'over') {
      // Reloaded after the end: show the end again and finish.
      g.phase = 'end';
      g.endsAt = party.now() + 3000;
    }
    changed();
    cue(g.phase);
  }

  // ---- A phone: write, vote, look up -----------------------------------------------------
  function phone(me) {
    const { el, textInput, timer, sound } = party.ui;
    const root = document.getElementById('phone');
    root.hidden = false;
    const myName = party.players.find((p) => p.id === me)?.name ?? 'You';
    let s = null;
    let mainKey = '';

    const tokEl = el('div', { class: 'tok' }, initial(myName));
    const scoreEl = el('span', { class: 'score' });
    const head = el('div', { class: 'me' }, tokEl, el('span', {}, myName), scoreEl);
    const main = el('div', { class: 'stack' });
    const foot = el('div', { class: 'stack' });
    root.append(head, main, el('div', { class: 'grow' }), foot);
    main.append(el('p', { class: 'say-big' }, 'Waiting for the big screen…'));

    party.on('state', (state) => {
      s = state;
      draw();
    });

    const say = (text) => el('p', { class: 'say-big' }, text);
    const timerBox = () => {
      const box = el('div');
      timer(box, { endsAt: s.endsAt });
      return box;
    };
    const placeLine = () => el('p', { class: 'muted' }, `You're ${ordinal(s.place)} of ${s.of} with ${s.score} points.`);

    /** [key, build]: the phone's main part is rebuilt only when its key changes. */
    function view() {
      const p = s.phase;
      if (p === 'intro') return ['intro', () => [say('Get ready to be funny.'), el('p', { class: 'muted' }, 'You’ll answer prompts here, then vote on the big screen’s matchups.')]];
      if (p === 'write' || p === 'final-write') {
        if (s.k === undefined) return [`done${p}${s.round}`, () => [say('All done! Waiting for the others.'), el('p', { class: 'muted' }, 'Look at the big screen to see who’s still writing.')]];
        return [`w${p}${s.round}-${s.k}`, () => {
          const box = el('div');
          const nodes = [
            el('div', { class: 'card-p' }, el('small', {}, p === 'write' ? `Prompt ${s.n} of ${s.total}` : 'The Last Word'), s.prompt),
            box,
          ];
          textInput(box, { placeholder: 'Your funniest answer', maxLength: ANSWER_MAX, lockOnSubmit: true, onSubmit: (text) => { sound('tap'); party.send({ k: s.k, answer: text }); } });
          return nodes;
        }];
      }
      if (p === 'vote') {
        if (s.mine) return [`mine${s.prompt}`, () => [say('That’s your prompt! Hands off the vote.'), el('div', { class: 'card-p' }, s.prompt)]];
        return [`v${s.prompt}${s.voted}`, () => [
          el('div', { class: 'card-p' }, el('small', {}, 'Which is funnier?'), s.prompt),
          el('div', { class: 'choices' },
            ['a', 'b'].map((side, i) => el('button', { type: 'button', class: `${side}${s.voted === side ? ' on' : ''}`, 'aria-pressed': s.voted === side ? 'true' : 'false', onClick: () => party.send({ vote: side }) }, s.answers[i]))),
          s.voted ? el('p', { class: 'muted' }, 'Voted! Tap the other one to change your mind.') : null,
        ]];
      }
      if (p === 'final-vote') {
        return [`fv${s.voted}`, () => [
          el('div', { class: 'card-p' }, el('small', {}, 'Vote for your favourite'), s.prompt),
          el('div', { class: 'choices' }, s.options.map((o) => el('button', { type: 'button', class: `w${s.voted === o.id ? ' on' : ''}`, 'aria-pressed': s.voted === o.id ? 'true' : 'false', onClick: () => party.send({ vote: o.id }) }, o.t))),
          s.voted ? el('p', { class: 'muted' }, 'Voted! Tap another to change your mind.') : null,
        ]];
      }
      if (p === 'reveal' || p === 'final-reveal' || p === 'scores') {
        return [`look${p}${s.score}${s.place}${s.prompt}`, () => [
          s.prompt ? el('div', { class: 'card-p' }, el('small', {}, 'On the big screen'), s.prompt) : null,
          say(p === 'scores' ? 'Look up! Here are the scores.' : 'Look up! Who wrote what?'),
          el('p', { class: 'big-num' }, String(s.score)),
          placeLine(),
        ]];
      }
      if (p === 'end' || p === 'over') {
        return ['end', () => [
          el('p', { class: 'say-big', style: { fontSize: '2rem' } }, s.place === 1 ? 'You won!' : `You came ${ordinal(s.place)}.`),
          el('p', { class: 'big-num' }, String(s.score)),
          el('p', { class: 'muted' }, `of ${s.of} players. Thanks for playing!`),
        ]];
      }
      return ['wait', () => [say('…')]];
    }

    let footKey = '';
    function draw() {
      if (!s) return;
      tokEl.style.background = s.color;
      scoreEl.textContent = `${s.score} pts`;
      const [key, build] = view();
      if (key !== mainKey) {
        mainKey = key;
        main.replaceChildren(...build().filter(Boolean));
      }
      // The foot: "Pick one for me" while writing, and the timer for any phase with a deadline.
      const fk = `${s.phase}${s.endsAt}${s.k}`;
      if (fk === footKey) return;
      footKey = fk;
      foot.replaceChildren();
      if ((s.phase === 'write' || s.phase === 'final-write') && s.k !== undefined) {
        foot.append(el('button', { type: 'button', class: 'big house-btn', onClick: () => party.send({ k: s.k, house: true }) }, 'Pick one for me'));
      }
      if (['intro', 'write', 'final-write', 'vote', 'final-vote'].includes(s.phase)) foot.append(timerBox());
    }
  }
</script>
